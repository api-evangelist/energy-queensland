    description: >-
      Mandatory OIDC scope for the CDR authorisation flow. Required on every
      consent request under the Security Profile.
    flows: [authorizationCode]
    sources: [https://consumerdatastandardsaustralia.github.io/standards/#authorisation-scopes]
  - scope: profile
    description: >-
      OIDC profile scope. Supported in the CDR authorisation flow alongside the
      CDR data scopes.
    flows: [authorizationCode]
    sources: [https://consumerdatastandardsaustralia.github.io/standards/#authorisation-scopes]

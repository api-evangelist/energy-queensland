method: searched
source: >-
  x-scopes vendor extension on every operation in
  openapi/energy-queensland-cds-energy-openapi.yml and
  openapi/energy-queensland-cds-common-openapi.yml (DSB Consumer Data Standards
  v1.36.0), cross-checked against the Authorisation Scopes section of the
  published standard.
docs: https://consumerdatastandardsaustralia.github.io/standards/#authorisation-scopes
description: >-
  The OAuth2 authorisation scopes that govern Ergon Energy Retail's Consumer
  Data Right energy surface. These scopes are NOT defined by Energy Queensland -
  they are set centrally by the Treasury Data Standards Body and are identical
  for all 84 registered Australian energy data holder brands. No scope can be
  requested by a caller who is not an ACCC-accredited data recipient, and every
  scope is consented to by the individual customer through the data holder's
  authorisation flow. The two anonymously callable surfaces recorded in apis.yml
  (Get Generic Plans / Get Generic Plan Detail on the AER host, Get Status /
  Get Outages on Ergon's public base URI) carry NO x-scopes at all and require
  no token; that absence is itself recorded below.
  No OAuth2 securityScheme is declared in the harvested OpenAPI documents - the
  DSB publishes the security model in the Security Profile section of the
  standard rather than in the swagger - so these scopes were read from the
  per-operation x-scopes extension, not from a flows map.
  Anonymous discovery of the token/authorisation endpoints was attempted and
  failed by design: GET https://public.cdr.ergonretail.com.au/.well-known/openid-configuration
  and /.well-known/oauth-authorization-server both returned HTTP 404 on
  2026-07-27, because a CDR data holder publishes its infosec base URI through
  the authenticated portion of the CDR Register, not publicly.
schemes:
  - name: CDR OAuth2 (FAPI 1.0 Advanced profile)
    source: https://consumerdatastandardsaustralia.github.io/standards/#security-profile
    flows:
      - flow: authorizationCode
        authorizationUrl: not publicly discoverable (authenticated CDR Register only)
        tokenUrl: not publicly discoverable (authenticated CDR Register only)
        notes: >-
          Authorization code flow with PKCE and Pushed Authorization Requests,
          OIDC id_token, private_key_jwt client authentication, and mutual TLS
          sender-constrained tokens. Client registration is dynamic (CDR DCR)
          using a software statement assertion issued by the CDR Register.
scopes:

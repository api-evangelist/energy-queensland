deprecation:
  policy_url: https://consumerdatastandardsaustralia.github.io/standards/includes/endpoint-version-schedule/
  mechanism: >-
    Endpoint-version schedule. Every version of every endpoint is published with
    a Binding Date (when data holders must serve it), a Date Deprecated and a
    Retirement Date. Deprecated versions continue to be served until the
    retirement date, after which a request for that version returns HTTP 406
    Header/UnsupportedVersion.
  sunset_header: false
  sunset_header_note: >-
    RFC 8594 Sunset/Deprecation headers are NOT used. Version retirement is
    published as dated schedule rows and enforced through x-v negotiation.

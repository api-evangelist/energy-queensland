sla:
  url: https://consumerdatastandardsaustralia.github.io/standards/#non-functional-requirements
  uptime_target: 99.5% per calendar month
  scope: >-
    Applies to authenticated AND unauthenticated endpoints. A period of
    unavailability is any period when any endpoint in the standard cannot
    reliably return a successful response to a well-formed request.
  planned_outages:
    excluded_from_target: true
    notice_requirement: >-
      Published to Data Recipient Software Products with at least one week lead
      time for normal outages; may occur without notice only to resolve a
      critical service or security issue.
  performance:
    requirement: 95% of calls per hour within the nominated threshold
    thresholds:
      unauthenticated: 1500ms
      high_priority: 1000ms
      low_priority: 1500ms
      unattended: 4000ms
      large_payload: 6000ms
      secondary_request: 1000ms (data holder) / 1500ms (secondary data holder)
      large_secondary_request: 1500ms (data holder) / 4500ms (secondary data holder)
    energy_high_priority_endpoints:
      - Get Status
      - Get Outages
      - Get Energy Accounts (customer present)
      - Get Energy Account Detail (customer present)
      - Get Balance For Energy Account (customer present)
      - Get Invoices For Account (customer present)
      - Get Customer / Get Customer Detail (customer present)
  secondary_data_holder_note: >-
    Unavailability of AEMO as the secondary data holder does not count against
    Ergon Energy Retail's availability, but it does mean usage, DER and service
    point requests may fail under the Shared Responsibility model.

source: >-
  https://consumerdatastandardsaustralia.github.io/standards/#versioning,
  https://consumerdatastandardsaustralia.github.io/standards/includes/endpoint-version-schedule/,
  https://consumerdatastandardsaustralia.github.io/standards/#non-functional-requirements,
  and live probes of Ergon Energy Retail's CDR hosts on 2026-07-27.
description: >-
  Energy Queensland publishes no versioning policy, no deprecation policy, no
  SLA and no status page of its own - and does not need to, because as a
  designated Consumer Data Right data holder its retail subsidiary inherits all
  four from the Treasury Data Standards Body. The deprecation policy in
  particular is unusually strong for a utility: every endpoint version in the
  standard carries a published Binding Date, Date Deprecated and Retirement
  Date, so a caller can see years in advance exactly when a version stops being
  served. The status page is not a marketing status page either - it is a
  mandated machine-readable endpoint that returned HTTP 200 "All services
  operational" when probed on 2026-07-27.

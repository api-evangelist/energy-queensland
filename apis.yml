- aid: energy-queensland:ergon-energy-retail-cdr-energy-consumer-data-api
  name: Ergon Energy Retail CDR Energy Consumer Data API
  description: >-
    The consumer-authorised half of the Consumer Data Right energy obligation that Ergon Energy
    Queensland Pty Ltd is designated to meet as a data holder - electricity service points, usage,
    distributed energy resources, energy accounts, balances, invoices, billing, concessions and
    payment schedules, sixteen paths in all from the Consumer Data Standards CDR Energy API. This
    surface is real and mandated, but it is not open: it is reachable only by an ACCC-accredited CDR
    data recipient, over mutual TLS with FAPI-profile OAuth2 and OpenID Connect, after the individual
    customer grants consent, and the infosec base URI is published only through the authenticated
    portion of the CDR Register. No baseURL is recorded here because none is publicly discoverable
    and no endpoint on this surface was called. What was observed, and is recorded as behavioural
    evidence rather than a call, is that the host api.cdr.ergonretail.com.au resolves
    (16.176.214.208, 15.134.24.248, 15.134.170.191) and its TLS handshake emits a Request CERT
    message backed by a private certificate chain - the mTLS gate the Consumer Data Standards
    security profile requires. The mandate is verified; the endpoints are, by design, unverifiable
    from outside the accreditation regime.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#energy-apis

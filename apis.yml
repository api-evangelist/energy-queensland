- aid: energy-queensland:ergon-energy-retail-cdr-discovery-api
  name: Ergon Energy Retail CDR Discovery API
  description: >-
    Ergon Energy Retail's own registered Consumer Data Right public base URI, serving the two
    unauthenticated Data Holder Operations endpoints of the Consumer Data Standards CDR Common API -
    Get Status and Get Outages. This is the only anonymously callable API surface hosted on an Energy
    Queensland controlled domain. Confirmed live 2026-07-27: GET /cds-au/v1/discovery/status with
    header x-v 1 returned HTTP 200 and the CDS envelope {"data":{"status":"OK","updateTime":
    "2026-07-27T12:08:30Z","explanation":"All services operational"},"links":{...},"meta":{}}, and
    GET /cds-au/v1/discovery/outages returned HTTP 200 with an empty outages array. The base URI
    serves nothing else anonymously - /cds-au/v1/energy/plans, the site root and
    /.well-known/openid-configuration all return an nginx HTTP 404.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#common-apis
  baseURL: https://public.cdr.ergonretail.com.au/cds-au/v1

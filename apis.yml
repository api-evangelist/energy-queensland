apis:
- aid: energy-queensland:ergon-energy-retail-cdr-energy-product-reference-data-api
  name: Ergon Energy Retail CDR Energy Product Reference Data API
  description: >-
    The unauthenticated Consumer Data Right Product Reference Data surface for Energy Queensland's
    retail brand, Ergon Energy Retail - Get Generic Plans and Get Generic Plan Detail from the
    Consumer Data Standards CDR Energy API. In CDR energy, unlike CDR banking, generic plan data is
    not served by the data holder's own host: it is served centrally by the Australian Energy
    Regulator's Energy Made Easy CDR host under a per-brand path, and the ACCC CDR Register exposes
    that path as productBaseUri from register version x-v 2 onwards. Confirmed live 2026-07-27:
    GET /cds-au/v1/energy/plans with header x-v 1 returned HTTP 200 and meta.totalRecords 36 with
    meta.totalPages 36; the first record is planId ERG1064038RRE1@EME, brand "ergon", brandName
    "Ergon Energy", fuelType ELECTRICITY, type REGULATED, geography.distributors ["Ergon"] with
    several hundred regional Queensland postcodes. Plan detail requires x-v 3 or higher - x-v 1
    returns urn:au-cds:error:cds-all:Header/UnsupportedVersion with HTTP 406, x-v 3 returns HTTP 200.
    The plan type is worth noting: Ergon Energy Retail sells Queensland government notified prices in
    regional Queensland, so these 36 plans are REGULATED rather than MARKET offers. No API key, no
    signup and no accreditation is needed to call it.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#energy-apis
  baseURL: https://cdr.energymadeeasy.gov.au/ergon/cds-au/v1

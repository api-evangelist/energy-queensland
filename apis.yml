aid: energy-queensland
url: https://raw.githubusercontent.com/api-evangelist/energy-queensland/refs/heads/main/apis.yml
name: Energy Queensland
kind: company
description: >-
  Energy Queensland Limited is the Queensland Government-owned corporation formed on 30 June 2016
  by merging Ergon Energy and Energex. It is the whole Queensland electricity value chain below
  transmission in a single holding company: Energex distributes to roughly 1.5 million connections
  across South East Queensland, Ergon Energy Network distributes across regional Queensland, Ergon
  Energy Retail is the notified-price retailer for about 760,000 regional customers, Yurika sells
  energy services and telecommunications, and SPARQ Solutions provides group ICT. That dual role is
  what makes its API posture worth recording precisely, because the two halves of the business sit
  on opposite sides of a statutory line. The RETAIL half is a designated Consumer Data Right energy
  data holder and its implementation is verified live, not claimed: "Ergon Energy Retail" (ABN
  11121177802) is listed on the ACCC CDR Register with publicBaseUri
  https://public.cdr.ergonretail.com.au and productBaseUri https://cdr.energymadeeasy.gov.au/ergon,
  both of which answered HTTP 200 to anonymous, standards-conformant calls on 2026-07-27, returning
  36 REGULATED electricity plans and a CDS discovery status of OK. The DISTRIBUTION half - the poles
  and wires - is not a CDR data holder at all, publishes no developer portal, no open-data API and no
  machine-readable contract, and has no developer., developers., api., docs. or data. subdomain in
  DNS on energyq.com.au, ergon.com.au or energex.com.au. Its network data reaches the public as PDF
  and XLSX planning reports, registration-free but non-programmatic map viewers, and exactly one
  open-licensed spatial dataset deposited on the Queensland Government's CKAN portal. The split is
  the finding: a mandate transplanted from banking produced a real, anonymous, standardised API on
  the regulated retail side and changed nothing whatsoever on the network side it never touched.

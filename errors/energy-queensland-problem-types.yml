source: >-
  Live error probes of the two anonymous Ergon Energy Retail CDR surfaces on
  2026-07-27 (payloads captured verbatim below), plus the 4xx responses declared
  in openapi/energy-queensland-cds-energy-openapi.yml and
  openapi/energy-queensland-cds-common-openapi.yml, plus the CDS error code
  reference at https://consumerdatastandardsaustralia.github.io/standards/#error-codes
docs: https://consumerdatastandardsaustralia.github.io/standards/#error-codes
format: cds-error-list
format_note: >-
  NOT RFC 9457. The Consumer Data Standards predate wide problem+json adoption
  and define their own envelope: content-type application/json with a top-level
  "errors" array, each element carrying code (a urn:au-cds:error:... URN), title
  (stable per code) and detail (occurrence specific), plus an optional meta.urn
  when a data holder extends a standard code with an application-specific one.
  The energy service-point and DER/usage operations use PrimaryErrorV1, which
  adds isSecondaryDataHolderError to flag an error propagated from AEMO as the
  CDR secondary data holder.
envelope:
  schema_energy: ResponseErrorListV2 / PrimaryResponseErrorListV1
  schema_common: ResponseErrorListV2
  shape:
    errors:
      - code: urn:au-cds:error:cds-all:Header/UnsupportedVersion
        title: Unsupported Version
        detail: Header x-v greater than maximum supported [x-v=99, max=1]
  fields:
    code: The error code URN, or an application-specific code with meta.urn naming the URN it extends.
    title: Short human-readable summary that MUST NOT change between occurrences of the same code.
    detail: Human-readable explanation specific to this occurrence.
    meta.urn: Conditional. The CDR error code URN an application-specific code extends.
    isSecondaryDataHolderError: PrimaryErrorV1 only. True when the error was propagated from AEMO.
problems:
  - status: 400
    code: urn:au-cds:error:cds-all:Header/Missing
    title: Missing Required Header
    verified: live
    request: GET https://cdr.energymadeeasy.gov.au/ergon/cds-au/v1/energy/plans (no x-v header)
    response_verbatim: '{"errors":[{"code":"urn:au-cds:error:cds-all:Header/Missing","title":"Missing Required Header","detail":"Header x-v must be provided"}]}'
    remediation: Always send an x-v header naming the endpoint version you want.
  - status: 400
    code: urn:au-cds:error:cds-all:Header/InvalidVersion
    title: Invalid Version
    verified: live
    request: GET .../energy/plans with x-v=abc
    response_verbatim: '{"errors":[{"code":"urn:au-cds:error:cds-all:Header/InvalidVersion","title":"Invalid Version","detail":"Header x-v must be positive integer [x-v=abc]"}]}'
    also_observed_on: >-
      https://public.cdr.ergonretail.com.au/cds-au/v1/discovery/status returns the
      same code with detail "Requested an unparseable version of abc" - the two
      hosts run different implementations and word the detail differently while
      keeping the code and title identical, which is exactly what the standard requires.
    remediation: x-v must be a positive integer.
  - status: 406
    code: urn:au-cds:error:cds-all:Header/UnsupportedVersion
    title: Unsupported Version
    verified: live
    request: GET .../energy/plans with x-v=99
    response_verbatim: '{"errors":[{"code":"urn:au-cds:error:cds-all:Header/UnsupportedVersion","title":"Unsupported Version","detail":"Header x-v greater than maximum supported [x-v=99, max=1]"}]}'
    also_observed: >-
      GET .../energy/plans/ERG1064038RRE1@EME with x-v=1 returns the same code
      with detail "Header x-v lower than minimum supported [x-v=1, min=3]", and
      the discovery endpoints return it with detail "Unable to locate a version
      of ResponseCommonDiscoveryStatus that is between version 99 and 99".
    remediation: >-
      Negotiate down to a supported endpoint version. Get Generic Plans supports
      max version 1 on this host; Get Generic Plan Detail requires minimum
      version 3. See lifecycle/energy-queensland-lifecycle.yml.
  - status: 400
    code: urn:au-cds:error:cds-all:Field/InvalidPageSize
    title: Invalid Page Size
    verified: live
    request: GET .../energy/plans?page-size=99999 with x-v=1
    response_verbatim: '{"errors":[{"code":"urn:au-cds:error:cds-all:Field/InvalidPageSize","title":"Invalid Page Size","detail":"Field page-size cannot be more than 1000 [page-size=99999]"}]}'
    remediation: page-size must be between 1 and 1000 (default 25).
  - status: 400
    code: urn:au-cds:error:cds-all:Field/Invalid
    title: Invalid Field
    verified: live
    request: GET .../energy/plans?page=notanumber with x-v=1
    response_verbatim: '{"errors":[{"code":"urn:au-cds:error:cds-all:Field/Invalid","title":"Invalid Field","detail":"Field page must be a positive integer [page=notanumber]"}]}'
    remediation: Correct the named field. The detail always names the offending field and value.
  - status: 400
    code: urn:au-cds:error:cds-all:Field/Missing
    title: Missing Required Field
    verified: spec
    source_operation: openapi/energy-queensland-cds-energy-openapi.yml (declared on all 400 responses)
  - status: 400
    code: urn:au-cds:error:cds-all:Field/InvalidDateTime

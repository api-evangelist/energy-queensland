notes: >-
  No 401/403 error is declared anywhere in the harvested documents because the
  authorisation failures for a CDR data holder are defined in the Security
  Profile (invalid consent, revoked consent, ADR status not active) rather than
  in the resource API swagger. Those codes exist in the standard
  (urn:au-cds:error:cds-all:Authorisation/*) but were not observed here and no
  gated endpoint was called.

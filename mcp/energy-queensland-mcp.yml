search_result: No official or hosted Model Context Protocol server exists for Energy Queensland, Ergon
  Energy Retail, Ergon Energy Network or Energex, and none exists for the Consumer Data Right energy surface
  generally. Nothing was found in the group's GitHub organisation (2 repos, both forks of AEMO tooling),
  on npm, or in the Consumer Data Standards. NO MCPServer pointer is wired in apis.yml, because there
  is no MCP server - this file is an API Evangelist DESIGN CANDIDATE showing what one would look like,
  not a provider artifact.
description: A candidate MCP tool surface for the Ergon Energy Retail CDR APIs. Four tools are anonymously
  callable today by anyone; the remaining twenty-three would require the MCP server itself to hold ACCC
  data recipient accreditation, CDR Register certificates and a live consumer consent, which is a very
  different deployment from a normal API-key MCP server and is the honest reason no such server exists.

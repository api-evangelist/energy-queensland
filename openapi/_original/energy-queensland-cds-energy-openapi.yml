          type: number
      required:
      - unitPrice
      type: object
    EnergyPlanSolarFeedInTariffV3_timeVariations:
      properties:
        days:
          description: The days that this time window applies to. At least one entry required.
          items:
            $ref: '#/components/schemas/EnergyDaysEnum'
          type: array
        endTime:
          description: The end of the time window per day for which the tariff applies. If absent assumes end of day (i.e.
            one second before midnight). Formatted according to [ISO 8601 Times](https://en.wikipedia.org/wiki/ISO_8601#Times).
            If the time is provided without a UTC offset, the time zone will be determined by the value of EnergyPlanContract.timeZone.
          type: string
          x-cds-type: ExternalRef
        startTime:
          description: The beginning of the time window per day for which the tariff applies. If absent assumes start of day
            (i.e. midnight). Formatted according to [ISO 8601 Times](https://en.wikipedia.org/wiki/ISO_8601#Times). If the
            time is provided without a UTC offset, the time zone will be determined by the value of EnergyPlanContract.timeZone.
          type: string
          x-cds-type: ExternalRef
      required:
      - days
      type: object
    EnergyPlanSolarFeedInTariffV3_timeVaryingTariffs:
      properties:
        displayName:
          description: Display name of the tariff.
          type: string
        period:
          default: P1Y
          description: Usage period for which the block rate applies. Formatted according to [ISO 8601 Durations](https://en.wikipedia.org/wiki/ISO_8601#Durations)
            (excludes recurrence syntax). Defaults to `P1Y` if absent.
          type: string
          x-cds-type: ExternalRef
        rates:
          description: Array of feed in rates.
          items:
            $ref: '#/components/schemas/EnergyPlanSolarFeedInTariffV3_singleTariff_rates'
          type: array
        timeVariations:
          description: Array of time windows for which this tariff is applicable.
          items:
            $ref: '#/components/schemas/EnergyPlanSolarFeedInTariffV3_timeVariations'
          type: array
        type:
          description: The type of the charging time period. If absent applies to all periods.
          enum:
          - PEAK
          - OFF_PEAK
          - SHOULDER
          type: string
      required:
      - displayName
      - timeVariations
      type: object
    EnergyPlanTariffPeriodV2:
      properties:
        bandedDailySupplyCharges:
          description: Array representing banded daily supply charge rates. Mandatory if _dailySupplyChargeType_ is `BAND`.
          items:
            $ref: '#/components/schemas/EnergyPlanTariffPeriodV2_bandedDailySupplyCharges'
          type: array
        dailySupplyCharge:
          description: The amount of access charge for the tariff period, in dollars per day exclusive of GST. Mandatory if
            _dailySupplyChargeType_ is `SINGLE`.
          type: string
          x-cds-type: AmountString
        dailySupplyChargeType:
          description: Specifies if daily supply charge is single or banded.
          enum:
          - SINGLE
          - BAND
          type: string
        demandCharges:
          description: Array of demand charges. Required if _rateBlockUType_ is `demandCharges`.
          items:
            $ref: '#/components/schemas/EnergyPlanTariffPeriodV2_demandCharges'
          type: array
        displayName:
          description: The name of the tariff period.
          type: string
        endDate:
          description: The end date of the tariff period in a calendar year. Formatted in mm-dd format.
          type: string
        rateBlockUType:
          description: Specifies the type of rate applicable to this tariff period.
          enum:
          - singleRate
          - timeOfUseRates
          - demandCharges
          type: string
        singleRate:
          $ref: '#/components/schemas/EnergyPlanTariffPeriodV2_singleRate'
        startDate:
          description: The start date of the tariff period in a calendar year. Formatted in mm-dd format.
          type: string
        timeOfUseRates:
          description: Array of objects representing time of use rates that apply throughout the _tariffPeriod_. Required
            if _rateBlockUType_ is `timeOfUseRates`.
          items:
            $ref: '#/components/schemas/EnergyPlanTariffPeriodV2_timeOfUseRates'
          type: array
        timeZone:
          description: Specifies the charge specific time zone for calculation of the time of use thresholds. If absent, timezone
            value in EnergyPlanContract is assumed.
          enum:
          - LOCAL
          - AEST
          type: string
        type:
          default: OTHER
          description: Type of charge. Assumed to be `OTHER` if absent.
          enum:
          - ENVIRONMENTAL
          - REGULATED
          - NETWORK
          - METERING
          - RETAIL_SERVICE
          - RCTI
          - OTHER
          type: string
      required:
      - displayName
      - endDate
      - rateBlockUType
      - startDate
      type: object
      x-conditional:
      - singleRate
      - timeOfUseRates
      - demandCharges
      - dailySupplyCharge
      - bandedDailySupplyCharges
    EnergyPlanTariffPeriodV2_bandedDailySupplyCharges:
      properties:
        measureUnit:
          allOf:
          - $ref: '#/components/schemas/MeasureUnitEnum'
          default: DAYS
          description: The measurement unit of rate. Assumed to be `DAYS` if absent.
          type: string
        unitPrice:
          description: The amount of daily supply charge for the band, in dollars per day exclusive of GST.
          type: string
          x-cds-type: AmountString
        volume:
          description: Volume the charge applies to.
          type: number
      required:
      - unitPrice
      type: object
    EnergyPlanTariffPeriodV2_demandCharges:
      properties:
        amount:
          description: The charge amount per measure unit exclusive of GST.
          type: string
          x-cds-type: AmountString
        chargePeriod:
          description: Charge period for the demand tariff.
          enum:
          - DAY
          - MONTH
          - TARIFF_PERIOD
          type: string
        days:
          description: The days that the demand tariff applies to.
          items:
            $ref: '#/components/schemas/EnergyDaysEnum'
          type: array
        description:
          description: Description of the charge.
          type: string
        displayName:
          description: Display name of the charge.
          type: string
        endTime:
          description: End of the period. Formatted according to [ISO 8601 Times](https://en.wikipedia.org/wiki/ISO_8601#Times).
            If the time is provided without a UTC offset, the time zone will be determined by the value of EnergyPlanContract.timeZone.
          type: string
          x-cds-type: ExternalRef
        maxDemand:
          description: Maximum demand for this demand tariff in kW. If present, must be higher than the value of the _minDemand_
            field.
          type: string
          x-cds-type: AmountString
        measureUnit:
          allOf:
          - $ref: '#/components/schemas/MeasureUnitEnum'
          default: KWH
          description: The measurement unit of charge amount. Assumed to be `KWH` if absent.
          type: string
        measurementPeriod:
          description: Application period for the demand tariff.
          enum:
          - DAY
          - MONTH
          - TARIFF_PERIOD
          type: string
        minDemand:
          default: '0.00'
          description: Minimum demand for this demand tariff in kW. If absent then `0.00` is assumed.
          type: string
          x-cds-type: AmountString
        startTime:
          description: Start of the period. Formatted according to [ISO 8601 Times](https://en.wikipedia.org/wiki/ISO_8601#Times).
            If the time is provided without a UTC offset, the time zone will be determined by the value of EnergyPlanContract.timeZone.
          type: string
          x-cds-type: ExternalRef
      required:
      - amount
      - chargePeriod
      - displayName
      - endTime
      - measurementPeriod
      - startTime
      type: object
    EnergyPlanTariffPeriodV2_singleRate:
      description: Object representing a single rate. Required if _rateBlockUType_ is `singleRate`.
      properties:
        description:
          description: Description of the rate.
          type: string
        displayName:
          description: Display name of the rate.
          type: string
        generalUnitPrice:
          description: The block rate (unit price) for any usage above the included fixed usage, in dollars per kWh inclusive
            of GST. Only required if _pricingModel_ field is `QUOTA`.
          type: string
          x-cds-type: AmountString
        period:
          description: Usage period for which the block rate applies. Formatted according to [ISO 8601 Durations](https://en.wikipedia.org/wiki/ISO_8601#Durations)
            (excludes recurrence syntax).
          type: string
          x-cds-type: ExternalRef
        rates:
          description: Array of rates in order of usage volume.
          items:
            $ref: '#/components/schemas/EnergyPlanControlledLoadV2_singleRate_rates'
          type: array
      required:
      - displayName
      - rates
      type: object
      x-conditional:
      - generalUnitPrice
    EnergyPlanTariffPeriodV2_timeOfUse:
      properties:
        days:
          description: The days that this time window applies to.
          items:
            $ref: '#/components/schemas/EnergyDaysEnum'
          type: array
        endTime:
          description: The end of the time window per day for which the rate applies. Formatted according to [ISO 8601 Times](https://en.wikipedia.org/wiki/ISO_8601#Times).
            If the time is provided without a UTC offset, the time zone will be determined by the value of EnergyPlanContract.timeZone.
          type: string
          x-cds-type: ExternalRef
        startTime:
          description: The beginning of the time window per day for which the rate applies. Formatted according to [ISO 8601
            Times](https://en.wikipedia.org/wiki/ISO_8601#Times). If the time is provided without a UTC offset, the time zone
            will be determined by the value of EnergyPlanContract.timeZone.
          type: string
          x-cds-type: ExternalRef
      required:
      - days
      - endTime
      - startTime
      type: object
    EnergyPlanTariffPeriodV2_timeOfUseRates:
      properties:
        description:
          description: Description of the rate.
          type: string
        displayName:
          description: Display name of the rate.
          type: string
        period:
          default: P1Y
          description: Usage period for which the block rate applies. Formatted according to [ISO 8601 Durations](https://en.wikipedia.org/wiki/ISO_8601#Durations)
            (excludes recurrence syntax). Defaults to `P1Y` if absent.
          type: string
          x-cds-type: ExternalRef
        rates:
          description: Array of rates in order of usage volume.
          items:
            $ref: '#/components/schemas/EnergyPlanControlledLoadV2_singleRate_rates'
          type: array
        timeOfUse:
          description: Array of time windows for which this time of use rate applies.
          items:
            $ref: '#/components/schemas/EnergyPlanTariffPeriodV2_timeOfUse'
          type: array
        type:
          description: The type of usage that the rate applies to.
          enum:
          - PEAK
          - OFF_PEAK
          - SHOULDER
          - SHOULDER1
          - SHOULDER2
          type: string
      required:
      - displayName
      - rates
      - timeOfUse
      - type
      type: object
    EnergyPlan_additionalInformation:
      description: Object that contains links to additional information on specific topics.
      properties:
        bundleUri:
          description: A link to detail on bundles that this plan can be a part of.
          type: string
          x-cds-type: URIString
        eligibilityUri:
          description: A link to detail on eligibility criteria for the plan.
          type: string
          x-cds-type: URIString
        overviewUri:
          description: A link to a general overview of the plan.
          type: string
          x-cds-type: URIString
        pricingUri:
          description: A link to detail on pricing for the plan.
          type: string
          x-cds-type: URIString
        termsUri:
          description: A link to terms and conditions for the plan.
          type: string
          x-cds-type: URIString
      type: object
    EnergyPlan_geography:
      description: Describes the geographical area that the plan is available for. If absent then it is assumed the plan is
        not geographically limited.
      properties:
        distributors:
          description: Array of distributors for the plan. Must have at least one entry.
          items:
            type: string
          type: array
        excludedPostcodes:
          description: Array of valid Australian postcodes that are specifically excluded from the plan. Each element is a
            single four digit postcode (e.g., `3000`) or a range of postcodes defined by two four digit postcodes and a hyphen
            (e.g., `3000-3999`).
          items:
            type: string
          type: array
        includedPostcodes:
          description: Array of valid Australian postcodes that are included from the plan. If absent defaults to all non-excluded
            postcodes. Each element is a single four digit postcode (e.g., `3000`) or a range of postcodes defined by two
            four digit postcodes and a hyphen (e.g., `3000-3999`).
          items:
            type: string
          type: array
      required:
      - distributors
      type: object
    EnergyServicePointDetailResponseV2:
      properties:
        data:
          $ref: '#/components/schemas/EnergyServicePointDetailV2'
        links:
          $ref: '#/components/schemas/Links'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - links
      type: object
    EnergyServicePointDetailV2:
      allOf:
      - $ref: '#/components/schemas/EnergyServicePointV2'
      - $ref: '#/components/schemas/EnergyServicePointDetailV2_allOf'
    EnergyServicePointDetailV2_allOf:
      properties:
        distributionLossFactor:
          $ref: '#/components/schemas/EnergyServicePointDetailV2_allOf_distributionLossFactor'
        location:
          allOf:
          - $ref: '#/components/schemas/CommonPhysicalAddress'
          description: Location of the servicepoint.
        meters:
          description: The meters associated with the service point. This may be empty where there are no meters physically
            installed at the service point.
          items:
            $ref: '#/components/schemas/EnergyServicePointDetailV2_allOf_meters'
          type: array
        relatedParticipants:
          items:
            $ref: '#/components/schemas/EnergyServicePointDetailV2_allOf_relatedParticipants'
          type: array
      required:
      - distributionLossFactor
      - location
      - relatedParticipants
    EnergyServicePointDetailV2_allOf_distributionLossFactor:
      properties:
        code:
          description: A code used to identify data loss factor for the service point values. Refer to AEMO distribution loss
            factor documents for each financial year to interpret.
          type: string
        description:
          description: Description of the data loss factor code and value.
          type: string
        lossValue:
          description: The value associated with the loss factor code.
          type: string
      required:
      - code
      - description
      - lossValue
      type: object
    EnergyServicePointDetailV2_allOf_meters:
      properties:
        meterId:
          description: The meter ID uniquely identifies a meter for a given service point. It is unique in the context of
            the service point. It is not globally unique.
          type: string
        registers:
          description: Usage data registers available from the meter. This may be empty where there are no meters physically
            installed at the service point.
          items:
            $ref: '#/components/schemas/EnergyServicePointDetailV2_allOf_registers'
          type: array
        specifications:
          $ref: '#/components/schemas/EnergyServicePointDetailV2_allOf_specifications'
      required:
      - meterId
      - specifications
      type: object
    EnergyServicePointDetailV2_allOf_registers:
      properties:
        averagedDailyLoad:
          description: The energy delivered through a connection point or metering point over an extended period normalised
            to a 'per day' basis (kWh). This value is calculated annually.
          type: number
        consumptionType:
          description: 'Actual/Subtractive Indicator. Note the details of enumeration values below: <ul><li>`ACTUAL`: implies
            volume of energy actually metered between two dates</li><li>`CUMULATIVE`: indicates a meter reading for a specific
            date. A second Meter Reading is required to determine the consumption between those two Meter Reading dates.</li></ul>'
          enum:
          - ACTUAL
          - CUMULATIVE
          type: string
        controlledLoad:
          description: Indicates whether the energy recorded by this register is created under a Controlled Load regime.
          type: boolean
        multiplier:
          description: Multiplier required to take a register value and turn it into a value representing billable energy.
          type: number
        networkTariffCode:
          description: The Network Tariff Code is a free text field containing a code supplied and published by the local
            network service provider.
          type: string
        registerConsumptionType:
          description: Indicates the consumption type of register.
          enum:
          - INTERVAL
          - BASIC
          - PROFILE_DATA
          - ACTIVE_IMPORT
          - ACTIVE
          - REACTIVE_IMPORT
          - REACTIVE
          type: string
        registerId:
          description: Unique identifier of the register within this service point. Is not globally unique.
          type: string
        registerSuffix:
          description: Register suffix of the meter register where the meter reads are obtained.
          type: string
        timeOfDay:
          description: Code to identify the time validity of register contents.
          enum:
          - ALLDAY
          - INTERVAL
          - PEAK
          - BUSINESS
          - SHOULDER
          - EVENING
          - OFFPEAK
          - CONTROLLED
          - DEMAND
          type: string
        unitOfMeasure:
          description: The unit of measure for data held in this register.
          type: string
      required:
      - registerConsumptionType
      - registerId
      type: object
    EnergyServicePointDetailV2_allOf_relatedParticipants:
      properties:
        party:
          description: The name of the party/organisation related to this service point.
          type: string
        role:
          description: 'The role performed by this participant in relation to the service point. Note the details of enumeration
            values below: <ul><li>`FRMP`: Financially Responsible Market Participant</li><li>`LNSP`: Local Network Service
            Provider or Embedded Network Manager for child connection points</li><li>`DRSP`: wholesale Demand Response and/or
            market ancillary Service Provider and note that where it is not relevant for a NMI it will not be included.</li></ul>'
          enum:
          - FRMP
          - LNSP
          - DRSP
          type: string
      required:
      - party
      - role
      type: object
    EnergyServicePointDetailV2_allOf_specifications:
      description: Technical characteristics of the meter.
      properties:
        installationType:
          description: 'The metering Installation type code indicates whether the metering installation has to be manually
            read. Note the details of enumeration values below: <ul><li>`BASIC`: Accumulation Meter – Type 6</li><li>`COMMS1`:
            Interval Meter with communications – Type 1</li><li>`COMMS2`: Interval Meter with communications – Type 2</li><li>`COMMS3`:
            Interval Meter with communications – Type 3</li><li>`COMMS4`: Interval Meter with communications – Type 4</li><li>`COMMS4C`:
            CT connected metering installation that meets the minimum services specifications</li><li>`COMMS4D`: Whole current
            metering installation that meets the minimum services specifications</li><li>`MRAM`: Small customer metering installation
            – Type 4A</li><li>`MRIM`: Manually Read Interval Meter – Type 5</li><li>`UMCP`: Unmetered Supply – Type 7</li><li>`VICAMI`:
            A relevant metering installation as defined in clause 9.9C of the NER</li><li>`NCONUML`: Non-contestable unmeter
            load - Introduced as part of Global Settlement.</li></ul>'
          enum:
          - BASIC
          - COMMS1
          - COMMS2
          - COMMS3
          - COMMS4
          - COMMS4C
          - COMMS4D
          - MRAM
          - MRIM
          - PROF
          - SAMPLE
          - UMCP
          - VICAMI
          - NCOLNUML
          type: string
        manufacturer:
          description: Free text field to identify the manufacturer of the installed meter.
          type: string
        model:
          description: Free text field to identify the meter manufacturer's designation for the meter model.
          type: string
        nextScheduledReadDate:
          description: This date is the next scheduled meter read date (NSRD) if a manual Meter Reading is required.
          type: string
          x-cds-type: DateString
        readType:
          description: 'Code to denote the method and frequency of Meter Reading. The value is formatted as follows: <ul><li>First
            Character = Remote (`R`) or Manual (`M`)</li><li>Second Character = Mode: `T` = telephone, `W` = wireless, `P`
            = powerline, `I` = infra-red, `G` = galvanic, `V` = visual</li><li>Third Character = Frequency of Scheduled Meter
            Readings: `1` = Twelve times per year, `2` = Six times per year, `3` = Four times per year, `D` = Daily or weekly</li><li>Optional
            Fourth Character = to identify what interval length the meter is capable of reading. This includes five, 15 and
            30 minute granularity as the following: `A` = 5 minute, `B` = 15 minute, `C` = 30 minute, `D` = Cannot convert
            to 5 minute (i.e. due to metering installation de-energised), `M` = Manually Read Accumulation Meter.</li></ul>For
            example, <ul><li>`MV3` = Manual, Visual, Quarterly</li><li>`MV3M` = Manual, Visual, Quarterly, Manually Read Accumulation
            Meter</li><li>`RWDC` = Remote, Wireless, Daily, 30 minutes interval.</li></ul>'
          type: string
        status:
          description: 'A code to denote the status of the meter. Note the details of enumeration values below: <ul><li>`CURRENT`:
            Applies when a meter is current and not disconnected</li><li>`DISCONNECTED`: Applies when a meter is present but
            has been remotely disconnected.</li></ul>'
          enum:
          - CURRENT
          - DISCONNECTED
          type: string
      required:
      - installationType
      - status
      type: object
    EnergyServicePointId:
      description: A unique identifier for an Energy service point, generated according to [CDR ID Permanence](#id-permanence)
        requirements.
      type: string
      x-cds-type: ASCIIString
    EnergyServicePointListResponseV2:
      properties:
        data:
          $ref: '#/components/schemas/EnergyServicePointListResponseV2_data'
        links:
          $ref: '#/components/schemas/LinksPaginated'
        meta:
          $ref: '#/components/schemas/MetaPaginated'
      required:
      - data
      - links
      - meta
      type: object
    EnergyServicePointListResponseV2_data:
      properties:
        servicePoints:
          items:
            $ref: '#/components/schemas/EnergyServicePointV2'
          type: array
      required:
      - servicePoints
      type: object
    EnergyServicePointV2:
      properties:
        consumerProfile:
          $ref: '#/components/schemas/EnergyServicePointV2_consumerProfile'
        isGenerator:
          default: false
          description: This flag determines whether the energy at this connection point is to be treated as consumer load
            or as a generating unit (this may include generator auxiliary loads). If absent defaults to `false`. <br>**Note:**
            Only applicable for scheduled or semischeduled generators, does not indicate on site generation by consumer.
          type: boolean
        jurisdictionCode:
          description: 'Jurisdiction code to which the service point belongs.This code defines the jurisdictional rules which
            apply to the service point. Note the details of enumeration values below:<ul><li>`ALL`: All Jurisdictions</li><li>`ACT`:
            Australian Capital Territory</li><li>`NEM`: National Electricity Market</li><li>`NSW`: New South Wales</li><li>`QLD`:
            Queensland</li><li>`SA`: South Australia</li><li>`TAS`: Tasmania</li><li>`VIC`: Victoria.</li></ul>'
          enum:
          - ALL
          - ACT
          - NEM
          - NSW
          - QLD
          - SA
          - TAS
          - VIC
          type: string
        lastConsumerChangeDate:
          description: The date the account holder changed for the NMI.
          type: string
          x-cds-type: DateString
        lastUpdateDateTime:
          description: The date and time that the information for this service point was modified.
          type: string
          x-cds-type: DateTimeString
        nationalMeteringId:
          description: The independent ID of the service point, known in the industry as the NMI.
          type: string
        servicePointClassification:
          description: The classification of the service point as defined in MSATS procedures.
          enum:
          - EXTERNAL_PROFILE
          - GENERATOR
          - LARGE
          - SMALL
          - WHOLESALE
          - NON_CONTEST_UNMETERED_LOAD
          - NON_REGISTERED_EMBEDDED_GENERATOR
          - DISTRIBUTION_WHOLESALE
          type: string
        servicePointId:
          allOf:
          - $ref: '#/components/schemas/EnergyServicePointId'
          description: Unique identifier for the service point.
        servicePointStatus:
          description: 'Code used to indicate the status of the service point. Note the details for the enumeration values
            below:<ul><li>`ACTIVE`: An active, energised, service point</li><li>`DE_ENERGISED`: The service point exists but
            is deenergised</li><li>`EXTINCT`: The service point has been permanently decommissioned</li><li>`GREENFIELD`:
            Applies to a service point that has never been energised</li><li>`OFF_MARKET`: Applies when the service point
            is no longer settled in the NEM.</li></ul>'
          enum:
          - ACTIVE
          - DE_ENERGISED
          - EXTINCT
          - GREENFIELD
          - OFF_MARKET
          type: string
        validFromDate:
          description: The latest start date from which the constituent data sets of this service point became valid.
          type: string
          x-cds-type: DateString
      required:
      - jurisdictionCode
      - lastUpdateDateTime
      - nationalMeteringId
      - servicePointClassification
      - servicePointId
      - servicePointStatus
      - validFromDate
      type: object
    EnergyServicePointV2_consumerProfile:
      properties:
        classification:
          description: A code that defines the consumer class as defined in the National Energy Retail Regulations, or in
            overriding Jurisdictional instruments.
          enum:
          - BUSINESS
          - RESIDENTIAL
          type: string
        threshold:
          description: 'A code that defines the consumption threshold as defined in the National Energy Retail Regulations,
            or in overriding Jurisdictional instruments. Note the details of enumeration values below: <ul><li>`LOW`: Consumption
            is less than the ''lower consumption threshold'' as defined in the National Energy Retail Regulations</li><li>`MEDIUM`:
            Consumption is equal to or greater than the ''lower consumption threshold'', but less than the ''upper consumption
            threshold'', as defined in the National Energy Retail Regulations</li><li>`HIGH`: Consumption is equal to or greater
            than the ''upper consumption threshold'' as defined in the National Energy Retail Regulations.</li></ul>'
          enum:
          - LOW
          - MEDIUM
          - HIGH
          type: string
      type: object
    EnergyUsageListResponse:
      properties:
        data:
          $ref: '#/components/schemas/EnergyUsageListResponse_data'
        links:
          $ref: '#/components/schemas/LinksPaginated'
        meta:
          $ref: '#/components/schemas/MetaPaginated'
      required:
      - data
      - links
      - meta
      type: object
    EnergyUsageListResponse_data:
      properties:
        reads:
          description: Array of meter reads sorted by NMI in ascending order followed by _readStartDate_ in descending order.
          items:
            $ref: '#/components/schemas/EnergyUsageRead'
          type: array
      required:
      - reads
      type: object
    EnergyUsageRead:
      properties:
        basicRead:
          $ref: '#/components/schemas/EnergyUsageRead_basicRead'
        controlledLoad:
          description: Indicates whether the energy recorded by this register is created under a Controlled Load regime.
          type: boolean
        intervalRead:
          $ref: '#/components/schemas/EnergyUsageRead_intervalRead'
        meterId:
          description: Meter id/serial number as it appears in customer's bill. ID permanence rules do not apply.
          type: string
        readEndDate:
          description: Date when the meter reads end in AEST. If absent then assumed to be equal to _readStartDate_. In this
            case the entry represents data for a single date specified by _readStartDate_.
          type: string
          x-cds-type: DateString
        readStartDate:
          description: Date when the meter reads start in AEST and assumed to start from 12:00am AEST.
          type: string
          x-cds-type: DateString
        readUType:
          description: Specify the type of the meter read data.
          enum:
          - basicRead
          - intervalRead
          type: string
        registerId:
          description: Register ID of the meter register where the meter reads are obtained.
          type: string
        registerSuffix:
          description: Register suffix of the meter register where the meter reads are obtained.
          type: string
        servicePointId:
          allOf:
          - $ref: '#/components/schemas/EnergyServicePointId'
          description: Unique identifier for the service point.
        unitOfMeasure:
          description: Unit of measure of the meter reads. Refer to Appendix B of <a href='https://www.aemo.com.au/-/media/files/stakeholder_consultation/consultations/nem-consultations/2019/5ms-metering-package-2/final-determination/mdff-specification-nem12-nem13-v21-final-determination-clean.pdf?la=en&hash=03FCBA0D60E091DE00F2361AE76206EA'>MDFF
            Specification NEM12 NEM13 v2.1</a> for a list of possible values.
          type: string
          x-cds-type: ExternalRef
      required:
      - readStartDate
      - readUType
      - registerSuffix
      - servicePointId
      type: object
      x-conditional:
      - basicRead
      - intervalRead
    EnergyUsageRead_basicRead:
      description: Mandatory if _readUType_ is set to `basicRead`.
      properties:
        quality:
          default: ACTUAL
          description: The quality of the read taken. If absent then assumed to be `ACTUAL`.
          enum:
          - ACTUAL
          - SUBSTITUTE
          - FINAL_SUBSTITUTE
          type: string
        value:
          description: Meter read value. If positive then it means consumption, if negative it means export.
          type: number
      required:
      - value
      type: object
    EnergyUsageRead_intervalRead:
      description: Mandatory if _readUType_ is set to `intervalRead`.
      properties:
        aggregateValue:
          description: The aggregate sum of the interval read values. If positive then it means net consumption, if negative
            it means net export.
          type: number
        intervalReads:
          description: Array of Interval read values. If positive then it means consumption, if negative it means export.
            Required when _interval-reads_ query parameter equals `FULL` or `MIN_30`.<br>Each read value indicates the read
            for the interval specified by _readIntervalLength_ beginning at midnight of _readStartDate_ (for example 00:00
            to 00:30 would be the first reading in a 30 minute Interval).
          items:
            type: number
          type: array
        readIntervalLength:
          description: Read interval length in minutes. Required when _interval-reads_ query parameter equals `FULL` or `MIN_30`.
          type: integer
          x-cds-type: PositiveInteger
        readQualities:
          description: ' Specifies quality of reads that are not `ACTUAL`. For read indices that are not specified, quality
            is assumed to be `ACTUAL`. If not present, all quality of all reads are assumed to be actual. Required when _interval-reads_
            query parameter equals `FULL` or `MIN_30`.'
          items:
            $ref: '#/components/schemas/EnergyUsageRead_intervalRead_readQualities'
          type: array
      required:
      - aggregateValue
      type: object
      x-conditional:
      - readIntervalLength
      - intervalReads
      - readQualities
    EnergyUsageRead_intervalRead_readQualities:
      properties:
        endInterval:
          description: End interval for read quality flag.
          example: 1
          type: integer
          x-cds-type: PositiveInteger
        quality:
          description: The quality of the read taken.
          enum:
          - SUBSTITUTE
          - FINAL_SUBSTITUTE
          type: string
        startInterval:
          description: Start interval for read quality flag. First read begins at `1`.
          example: 1
          type: integer
          x-cds-type: PositiveInteger
      required:
      - endInterval
      - quality
      - startInterval
      type: object
    ErrorV2:
      properties:
        code:
          description: The code of the error encountered. Where the error is specific to the respondent, an application-specific
            error code, expressed as a string value. If the error is application-specific, the URN code that the specific
            error extends must be provided in the _meta_ object. Otherwise, the value is the error code URN.
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          type: string
        meta:
          $ref: '#/components/schemas/ErrorV2_meta'
        title:
          description: A short, human-readable summary of the problem that **MUST NOT** change from occurrence to occurrence
            of the problem represented by the error code.
          type: string
      required:
      - code
      - detail
      - title
      type: object
      x-conditional:
      - meta
    ErrorV2_meta:
      description: Additional data for customised error codes.
      properties:
        urn:
          description: The CDR error code URN which the application-specific error code extends. Mandatory if the error _code_
            is an application-specific error rather than a standardised error code.
          type: string
      type: object
      x-conditional:
      - urn
    Links:
      properties:
        self:
          description: Fully qualified link that generated the current response document.
          type: string
          x-cds-type: URIString
      required:
      - self
      type: object
    LinksPaginated:
      properties:
        first:
          description: URI to the first page of this set. Mandatory if this response is not the first page.
          type: string
          x-cds-type: URIString
        last:
          description: URI to the last page of this set. Mandatory if this response is not the last page.
          type: string
          x-cds-type: URIString
        next:
          description: URI to the next page of this set. Mandatory if this response is not the last page.
          type: string
          x-cds-type: URIString
        prev:
          description: URI to the previous page of this set. Mandatory if this response is not the first page.
          type: string
          x-cds-type: URIString
        self:
          description: Fully qualified link that generated the current response document.
          type: string
          x-cds-type: URIString
      required:
      - self
      type: object
      x-conditional:
      - first
      - prev
      - next
      - last
    MeasureUnitEnum:
      enum:
      - KWH
      - KVA
      - KVAR
      - KVARH
      - KW
      - DAYS
      - METER
      - MONTH
      type: string
    Meta:
      type: object
    MetaPaginated:
      properties:
        totalPages:
          description: The total number of pages in the full set. See [pagination](#pagination).
          type: integer
          x-cds-type: NaturalNumber
        totalRecords:
          description: The total number of records in the full set. See [pagination](#pagination).
          type: integer
          x-cds-type: NaturalNumber
      required:
      - totalPages
      - totalRecords
      type: object
    PrimaryErrorV1:
      allOf:
      - $ref: '#/components/schemas/PrimaryErrorV1_allOf'
      - $ref: '#/components/schemas/ErrorV2'
      type: object
    PrimaryErrorV1_allOf:
      properties:
        isSecondaryDataHolderError:
          default: false
          description: Indicates the error was propagated from a designated secondary data holder.
          type: boolean
      type: object
    PrimaryResponseErrorListV1:
      properties:
        errors:
          description: List of errors.
          items:
            $ref: '#/components/schemas/PrimaryErrorV1'
          type: array
      required:
      - errors
      type: object

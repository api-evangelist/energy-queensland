    EnergyPlanContractV3:
      properties:
        additionalFeeInformation:
          description: Free text field containing additional information of the fees for this contract.
          type: string
        controlledLoad:
          description: Required if pricing model is `SINGLE_RATE_CONT_LOAD` or `TIME_OF_USE_CONT_LOAD` or `FLEXIBLE_CONT_LOAD`.
          items:
            $ref: '#/components/schemas/EnergyPlanControlledLoadV2'
          type: array
        discounts:
          description: Optional list of discounts available for the contract.
          items:
            $ref: '#/components/schemas/EnergyPlanDiscounts'
          type: array
        eligibility:
          description: Eligibility restrictions or requirements.
          items:
            $ref: '#/components/schemas/EnergyPlanEligibility'
          type: array
        fees:
          description: An array of fees applicable to the plan.
          items:
            $ref: '#/components/schemas/EnergyPlanFees'
          type: array
        greenPowerCharges:
          description: Optional list of charges applicable to green power.
          items:
            $ref: '#/components/schemas/EnergyPlanGreenPowerCharges'
          type: array
        incentives:
          description: Optional list of incentives available for the contract.
          items:
            $ref: '#/components/schemas/EnergyPlanIncentives'
          type: array
        intrinsicGreenPower:
          $ref: '#/components/schemas/EnergyPlanContractV3_intrinsicGreenPower'
        isFixed:
          description: Flag indicating whether prices are fixed or variable.
          type: boolean
        onExpiryDescription:
          description: Free text field that describes what will occur on or prior to expiry of the fixed contract term or
            benefit period.
          type: string
        paymentOption:
          description: Payment options for this contract.
          items:
            enum:
            - PAPER_BILL
            - CREDIT_CARD
            - DIRECT_DEBIT
            - BPAY
            - OTHER
            type: string
          type: array
        pricingModel:
          description: 'The pricing model for the contract. Contracts for gas must use `SINGLE_RATE`. Note that the detail
            for the enumeration values are:<ul><li>`SINGLE_RATE`: all energy usage is charged at a single unit rate no matter
            when it is consumed. Multiple unit rates may exist that correspond to varying volumes of usage i.e. a ''block''
            or ''step'' tariff (first 50kWh @ X cents, next 50kWh at Y cents etc.)</li><li>`SINGLE_RATE_CONT_LOAD`: as above,
            but with an additional, separate unit rate charged for all energy usage from a controlled load i.e. separately
            metered appliance like hot water service, pool pump etc.</li><li>`TIME_OF_USE`: energy usage is charged at unit
            rates that vary dependent on time of day and day of week that the energy is consumed</li><li>`TIME_OF_USE_CONT_LOAD`:
            as above, but with an additional, separate unit rate charged for all energy usage from a controlled load i.e.
            separately metered appliance like hot water service, pool pump etc.</li><li>`FLEXIBLE`: energy usage is charged
            at unit rates that vary based on external factors</li><li>`FLEXIBLE_CONT_LOAD`: as above, but with an additional,
            separate unit rate charged for all energy usage from a controlled load i.e. separately metered appliance like
            hot water service, pool pump etc.</li><li>`QUOTA`: all energy usage is charged at a single fixed rate, up to a
            specified usage quota/allowance. All excess usage beyond the allowance is then charged at a single unit rate.
            i.e. $50/month for up to 150kWh included usage.</li></ul>'
          enum:
          - SINGLE_RATE
          - SINGLE_RATE_CONT_LOAD
          - TIME_OF_USE
          - TIME_OF_USE_CONT_LOAD
          - FLEXIBLE
          - FLEXIBLE_CONT_LOAD
          - QUOTA
          type: string
        solarFeedInTariff:
          description: Array of feed in tariffs for solar power.
          items:
            $ref: '#/components/schemas/EnergyPlanSolarFeedInTariffV3'
          type: array
        tariffPeriod:
          description: Array of tariffs that apply to periods throughout the year.
          items:
            $ref: '#/components/schemas/EnergyPlanTariffPeriodV2'
          type: array
        timeZone:
          default: AEST
          description: Required if _pricingModel_ is set to `TIME_OF_USE`. Defines the time zone to use for calculation of
            the time of use thresholds. Defaults to `AEST` if absent.
          enum:
          - LOCAL
          - AEST
          type: string
        variation:
          description: Free text description of price variation policy and conditions for the contract. Mandatory if _isFixed_
            is `false`.
          type: string
      required:
      - isFixed
      - paymentOption
      - pricingModel
      - tariffPeriod
      type: object
      x-conditional:
      - timeZone
      - variation
      - controlledLoad

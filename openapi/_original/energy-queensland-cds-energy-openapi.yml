          - DLF
          - MLF
          type: string
        value:
          description: The value of the calculation factor.
          type: number
      required:
      - type
      - value
      type: object
    EnergyConcession:
      properties:
        additionalInfo:
          description: Display text providing more information on the concession. Mandatory if _type_ is `VARIABLE`.
          type: string
        additionalInfoUri:
          description: Optional link to additional information regarding the concession.
          type: string
          x-cds-type: URIString
        amount:
          description: Conditional attribute for the amount of discount for the concession- required if type is `FIXED_AMOUNT`.
          type: string
          x-cds-type: AmountString
        appliedTo:
          default:
          - USAGE
          description: Array of ENUMs to specify what the concession applies to. Multiple ENUM values can be provided. If
            absent, `USAGE` is assumed.
          items:
            enum:
            - INVOICE
            - USAGE
            - SERVICE_CHARGE
            - CONTROLLED_LOAD
            type: string
          type: array
        discountFrequency:
          description: Conditional attribute for frequency at which a concession is applied. Required if type is `FIXED_AMOUNT`
            or `FIXED_PERCENTAGE`. Formatted according to [ISO 8601 Durations](https://en.wikipedia.org/wiki/ISO_8601#Durations)
            (excludes recurrence syntax).
          type: string
          x-cds-type: ExternalRef
        displayName:
          description: The display name of the concession.
          type: string
        endDate:
          description: Optional end date for the application of the concession.
          type: string
          x-cds-type: DateString
        percentage:
          description: Conditional attribute for the percentage of discount of concession - required if type is `FIXED_PERCENTAGE`.
          type: string
          x-cds-type: RateString
        startDate:
          description: Optional start date for the application of the concession.
          type: string
          x-cds-type: DateString
        type:
          description: Indicator of the method of concession calculation.
          enum:
          - FIXED_AMOUNT
          - FIXED_PERCENTAGE
          - VARIABLE
          type: string
      required:

  developerPortal:
    exists: false
    url: ''
    note: >-
      No developer portal of any kind, on any of the three group domains. No developer, developers,
      api, docs, data or opendata subdomain resolves, and the main sites are bot-blocked to
      programmatic clients. The nearest thing to developer documentation for the APIs recorded here is
      the Data Standards Body's Consumer Data Standards site, which is not Energy Queensland's
      property and describes the standard rather than this implementation.
  openDataSurface:
    portal: false
    note: >-
      Energy Queensland operates no open-data portal. Its network data reaches the public as
      Distribution Annual Planning Report PDFs with XLSX load/capacity/constraint annexures, DAPR
      interactive map viewers on ergon.com.au and energex.com.au, postcode / LGA / network-level
      energy usage file downloads, and one dataset on someone else's portal.
    datasetsOnThirdPartyPortal:
      - id: ergon-energy-electrical-distribution-network-series
        portal: Queensland Government Open Data Portal (data.qld.gov.au, CKAN)
        organisation: Government commercial business
        licence: Other(Open)
        maintainer: gisdata@ergon.com.au
        resources: 5
        note: >-
          GIS extract describing sub-transmission, HV and LV overhead and underground network,
          structures, distribution substations and zone substations. Four resources are search-page
          links into the Queensland Spatial catalogue; one is an ISO 19115 XML metadata record.
    energexDatasets: 0
  ownership:
    parent: Queensland Government (100%)
    formed: '2016-06-30'
    note: >-
      Energy Queensland Limited was created by the merger of Ergon Energy and Energex, completed
      30 June 2016, with both distribution brands retained. Subsidiaries: Energex (distribution,
      South East Queensland), Ergon Energy Network (distribution, regional Queensland), Ergon Energy
      Retail / Ergon Energy Queensland Pty Ltd (ABN 11 121 177 802, ACN 121 177 802, regional
      notified-price retailer, registered office 420 Flinders Street, Townsville QLD 4810), Yurika
      (energy services and telecommunications) and SPARQ Solutions (group ICT). Roughly 2.3 million
      connections and about 760,000 retail customers. Shareholding ministers are the Queensland
      Treasurer and the energy portfolio minister.


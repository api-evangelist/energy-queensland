actions:
  openapiPaths:
    - openapi/energy-queensland-cds-energy-openapi.yml
    - openapi/energy-queensland-cds-common-openapi.yml
  openapiProvenance: >-
    DSB Consumer Data Standards shared specifications (CDR Energy API v1.36.0 and CDR Common API
    v1.36.0), harvested verbatim 2026-07-27. NOT Energy-Queensland-proprietary. No entity in the group
    publishes an OpenAPI document. Both files carry an inline provenance header stating source URL,
    fetch date, HTTP status, and exactly which paths Ergon Energy Retail actually serves anonymously
    versus which are accredited-only and were never called.
  apisYmlUpdated: true
  reason: >-
    Energy Queensland has a real, verified public API surface, but it belongs entirely to one
    subsidiary and exists entirely because Part IVD of the Competition and Consumer Act compelled it.
    Three APIs are recorded: the open, anonymous Product Reference Data surface served under the Ergon
    brand by the AER; the discovery surface on Ergon Energy Retail's own registered CDR host; and the
    mandated consumer-data surface, listed with no baseURL because none is publicly discoverable and
    none of its endpoints were called. Nothing is recorded for Energex or Ergon Energy Network because
    they publish nothing programmable, and inventing an entry for the distribution business would
    destroy the only finding this profile contains.
